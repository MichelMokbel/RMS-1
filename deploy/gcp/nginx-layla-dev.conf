server {
    listen 80;
    listen [::]:80;
    server_name rms-dev.34-156-128-236.sslip.io orders-dev.34-156-128-236.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rms-dev.34-156-128-236.sslip.io;

    ssl_certificate /etc/letsencrypt/live/rms-dev.34-156-128-236.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms-dev.34-156-128-236.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location = /up {
        proxy_pass http://127.0.0.1:8099;
        include proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8099;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location / {
        auth_basic "Layla RMS development";
        auth_basic_user_file /etc/nginx/layla-dev.htpasswd;
        proxy_pass http://127.0.0.1:8099;
        include proxy_params;
        proxy_read_timeout 180s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orders-dev.34-156-128-236.sslip.io;

    ssl_certificate /etc/letsencrypt/live/rms-dev.34-156-128-236.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms-dev.34-156-128-236.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8098;
        include proxy_params;
        proxy_read_timeout 180s;
    }
}
